name: Release

# Publishes a self-contained Windows build as a GitHub Release whenever a vX.Y.Z tag is pushed.
# The app's auto-updater reads the latest release and installs the WinMirroring-win-x64.zip asset.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish (self-contained win-x64)
        run: dotnet publish src/WinMirroring.App/WinMirroring.App.csproj -c Release -r win-x64 --self-contained -o publish

      - name: Zip the build
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath WinMirroring-win-x64.zip -Force

      - name: Create or update the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: WinMirroring-win-x64.zip
          generate_release_notes: true
