name: Release

# Publishes a self-contained Windows build as a GitHub Release whenever a vX.Y.Z tag is pushed.
# The app's auto-updater reads the latest release and installs the WinMirroring-win-x64.zip asset.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # A tag that is not the version in the project file would publish a build that calls itself something else,
      # and the updater compares exactly these two: it would offer that build for ever, or never. Stop before building.
      - name: The tag is the version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content src/WinMirroring.App/WinMirroring.App.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ("v$version" -ne "${{ github.ref_name }}") { throw "The tag ${{ github.ref_name }} is not the version in WinMirroring.App.csproj, which is $version" }
          "Building $version"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The React interface (src/WinMirroring.Ui) is built by the app's project file and shipped as wwwroot.
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: src/WinMirroring.Ui/package-lock.json

      - name: Publish (self-contained win-x64)
        run: dotnet publish src/WinMirroring.App/WinMirroring.App.csproj -c Release -r win-x64 --self-contained -o publish

      - name: Zip the build
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath WinMirroring-win-x64.zip -Force

      - name: Create or update the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: WinMirroring-win-x64.zip
          generate_release_notes: true
